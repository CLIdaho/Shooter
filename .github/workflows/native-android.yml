name: Android APK

on:
  push:
    branches:
      - main
      - "build/**"
    paths:
      - "modules/shooter-camera/**"
      - "src/**"
      - "App.tsx"
      - "app.json"
      - "package.json"
      - "package-lock.json"
      - ".github/workflows/native-android.yml"
  pull_request:
    paths:
      - "modules/shooter-camera/**"
      - "src/**"
      - "App.tsx"
      - "app.json"
      - "package.json"
      - "package-lock.json"
      - ".github/workflows/native-android.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  android-apk:
    runs-on: ubuntu-latest
    timeout-minutes: 40

    steps:
      - name: Checkout Shooter
        uses: actions/checkout@v5

      - name: Set up Node
        uses: actions/setup-node@v5
        with:
          node-version: 22.13.1

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Install dependencies
        run: npm install

      - name: Generate Android project
        run: npx expo prebuild --platform android --non-interactive --clean

      - name: Compile Dev and standalone Test APKs
        working-directory: android
        run: ./gradlew assembleDebug assembleRelease --no-daemon --stacktrace

      - name: Prepare APKs
        run: |
          mkdir -p dist
          cp android/app/build/outputs/apk/debug/app-debug.apk dist/Shooter-Dev.apk
          cp android/app/build/outputs/apk/release/app-release.apk dist/Shooter-Test.apk
          ls -lh dist

      - name: Upload standalone Test APK
        uses: actions/upload-artifact@v4
        with:
          name: Shooter-Test-APK
          path: dist/Shooter-Test.apk
          retention-days: 30
          if-no-files-found: error

      - name: Upload Dev APK
        uses: actions/upload-artifact@v4
        with:
          name: Shooter-Dev-APK
          path: dist/Shooter-Dev.apk
          retention-days: 14
          if-no-files-found: error

      - name: Publish phone-installable test release
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: android-test-${{ github.run_number }}
        run: |
          gh release create "$TAG" dist/Shooter-Test.apk \
            --repo "$GITHUB_REPOSITORY" \
            --target "$GITHUB_SHA" \
            --title "Shooter Android Test #${{ github.run_number }}" \
            --notes "Standalone Shooter test build for physical Android phones. Download Shooter-Test.apk directly on the phone and install it. No Expo Go or Metro server is required." \
            --prerelease
